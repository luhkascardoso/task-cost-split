# Code review com a skill .claude/skills/code-review. O job "review" é um CHECK OBRIGATÓRIO:
# falha quando o veredito é ⛔ (request_changes) ou há achado 🔴 bloqueante.
#
#  - PR para QUALQUER branch: revisa o diff do PR, comenta inline e publica um resumo.
#  - Push em QUALQUER branch sem PR aberto: revisa os commits novos; o resultado fica no
#    resumo do job (Actions → run → Summary) e no status do commit.
#  - Sem mudança de código ou de gates (só docs/assets): passa sem chamar o revisor.
#
# Pré-requisito: secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) ou ANTHROPIC_API_KEY.
# Sem ele o check falha de propósito (fail closed).
# Bloqueio de merge: scripts/setup-branch-ruleset.sh.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # Rascunho não é revisado (não pode ser mergeado). Push na branch padrão já veio de um PR revisado.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escopo do review
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/review-scope.sh

      - name: Review com Claude
        id: review
        if: steps.scope.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Token do próprio job (permissões acima). Sem ele a action troca um token com o app do
          # Claude, que pula a execução quando o PR altera este workflow e deixaria o check sem veredito.
          github_token: ${{ github.token }}
          # Os hooks do projeto (lint/tsc/jest) são para quem edita código; aqui só se lê.
          settings: '{"disableAllHooks": true}'
          prompt: |
            Use a skill code-review no modo ${{ steps.scope.outputs.mode == 'pr' && 'CI' || 'push' }}.
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.head_ref || github.ref_name }}
            BASE SHA: ${{ steps.scope.outputs.base }}
            HEAD SHA: ${{ github.sha }}
          claude_args: |
            --allowedTools "Skill,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(grep:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","blocking","important","suggestions","summary_markdown"],"properties":{"verdict":{"type":"string","enum":["approve","approve_with_changes","request_changes"]},"blocking":{"type":"integer","minimum":0},"important":{"type":"integer","minimum":0},"suggestions":{"type":"integer","minimum":0},"summary_markdown":{"type":"string"}}}'

      - name: Veredito
        if: steps.scope.outputs.run == 'true'
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
          SKIPPED: ${{ steps.review.outputs.skipped_due_to_workflow_validation_mismatch }}
        run: bash .github/scripts/review-verdict.sh

      - name: Sem review necessário
        if: steps.scope.outputs.run != 'true'
        run: echo "## Code review · ✅ ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
